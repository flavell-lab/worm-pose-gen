[project]
name = "worm-pose-gen"
version = "0.1.0"
description = "C. elegans pose from behaviour video: midline, width and head/tail per frame, with a review app"
readme = "README.md"
authors = [
    { name = "Alex Hiser", email = "hiserale@mit.edu" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "av>=19.0.2",
    "fastapi>=0.141.1",
    "h5py>=3.16.0",
    "httpx>=0.28.1",
    "imageio>=2.37.4",
    "imageio-ffmpeg>=0.6.0",
    "lightning>=2.6.5",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pyarrow>=25.0.1",
    "scipy>=1.18.1",
    "timm>=1.0.20",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
worm-pose-app = "worm_pose_gen.app:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
